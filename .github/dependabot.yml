version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/"
    schedule:
      interval: "weekly"
    allow:
      - update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: "pip"
    directory: "/backend/"
    schedule:
      interval: "weekly"
    allow:
      - update-types: ["version-update:semver-patch", "version-update:semver-minor"]
