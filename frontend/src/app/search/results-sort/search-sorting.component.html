<ia-dropdown (onChange)="changeField($event)" [value]="sortField" [labelledBy]="labelledBy" class="text-left">
    <span iaDropdownLabel>{{ sortField?.displayName || 'Relevance' }}</span>
    <div iaDropdownMenu>
      <button iaDropdownItem [value]="undefined">Relevance</button>
      @for (field of sortableFields; track field.name) {
        <button
          iaDropdownItem [value]="field">
          {{field.displayName}}
        </button>
      }    </div>
</ia-dropdown>
<button class="btn btn-body" type="button" (click)="toggleSortType()"
    [disabled]="!sortField">
    <fa-icon aria-hidden="true" [icon]="sortIcons[sortType]"></fa-icon>
    @if (ascending) {
        Ascending
    } @else {
        Descending
    }
</button>
