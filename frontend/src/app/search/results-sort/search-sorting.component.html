<div class="control has-text-left">
  <ia-dropdown (onChange)="changeField($event)" [value]="sortField"
    [labelledBy]="labelledBy">
    <span iaDropdownLabel>{{ sortField?.displayName || 'Relevance' }}</span>
    <div iaDropdownMenu>
      <button iaDropdownItem [value]="undefined">Relevance</button>
      @for (field of sortableFields; track field) {
        <button
          iaDropdownItem [value]="field">
          {{field.displayName}}
        </button>
      }
    </div>
  </ia-dropdown>
</div>
<div class="control">
  <button class="btn" type="button" (click)="toggleSortType()" [ngClass]="{ 'is-static': !sortField }">
    <span  aria-hidden="true">
      <fa-icon [icon]="sortIcons[sortType]"></fa-icon>
    </span>
    @if (ascending) {
      <span>Ascending</span>
    }
    @if (!ascending) {
      <span>Descending</span>
    }
  </button>
</div>
