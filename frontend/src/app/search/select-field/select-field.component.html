<p-multiSelect placeholder="All fields"
    [options]="options"
    [(ngModel)]="selected"
    [displaySelectedLabel]="true"
    (onChange)="onUpdate()"
    [ngModelOptions]="{standalone: true}"
    ngbTooltip="Limit your search to specific fields">
    <ng-template #footer>
        <button class="btn btn-ghost" (click)="toggleAllFields()">
            {{allVisible? 'Show default fields' : 'Show all fields'}}
        </button>
    </ng-template>
</p-multiSelect>
