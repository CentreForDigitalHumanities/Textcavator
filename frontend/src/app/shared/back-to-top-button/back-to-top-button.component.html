<div class="scroll-top-button-container p-4">
    <button class="button is-primary"
        (click)="scrollToTop()" aria-label="scroll to top"
        [class.is-hidden]="!isScrolledDown">
        <span class="icon" aria-hidden>
            <fa-icon [icon]="icon"/>
        </span>
    </button>
</div>
