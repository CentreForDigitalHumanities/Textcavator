<form>
  <div class="field is-grouped">
    <div class="control is-expanded">
      <p-autocomplete name="queries" [(ngModel)]="queries" multiple fluid
        [typeahead]="false" />
    </div>
    <div class="control">
      <button class="btn btn-primary" (click)="confirmQueries()" [disabled]="!valid(queries)">
        <span >
          <fa-icon [icon]="formIcons.confirm" aria-hidden="true"></fa-icon>
        </span>
        <span>Confirm</span>
      </button>
    </div>
    @if (showReset$ | async) {
      <div class="control">
        <button class="btn" (click)="reset()">
          <span >
            <fa-icon [icon]="formIcons.reset" aria-hidden="true"></fa-icon>
          </span>
          <span>Reset</span>
        </button>
      </div>
    }
  </div>
</form>
