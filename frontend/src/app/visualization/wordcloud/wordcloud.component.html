@if (results) {
  <div [class.is-loading]="results.loading$ | async">
    <div #chart id="chart" [class.d-none]="asTable" [attr.aria-hidden]="asTable"></div>
    <input iaThemeIndicator >
    @if (asTable) {
      <div class="my-3">
        <ia-freqtable [headers]="tableHeaders" [data]="results.result$ | async" [defaultSort]="'doc_count'" [name]="(results.state$ | async).field?.name">
        </ia-freqtable>
      </div>
    }
  </div>
}
