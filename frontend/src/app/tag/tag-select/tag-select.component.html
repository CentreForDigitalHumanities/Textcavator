<form class="input-group">
    @if (!createMode) {
        @if (filterTags(tags$ | async, exclude); as filteredTags) {
        <ia-dropdown (onChange)="selectedTag = $event" labelledBy="select-tag-placeholder"
            triggerClass="btn-sm">
            <span iaDropdownLabel>
                {{ selectedTag?.name }}
                <span [class.d-none]="selectedTag?.name !== null" id="select-tag-placeholder">
                    Assign a tag
                </span>
            </span>
            <div iaDropdownMenu>
                @for (tag of filteredTags; track tag) {
                <button iaDropdownItem [value]="tag">
                    {{tag.name}}
                </button>
                }
                <button iaDropdownItem (onSelect)="toggleCreate()" [value]="null">
                    <span><fa-icon [icon]="actionIcons.add"></fa-icon></span>
                    <span>Create a new tag</span>
                </button>
            </div>
        </ia-dropdown>
        }
    }
    @if (createMode) {
        <input type="text" aria-label="new tag name"
            class="form-control form-control-sm tag-input"
            placeholder="Enter tag name" name="tag-name" #newTagNameInput [(ngModel)]="newTagName">
    }
    <button class="btn btn-body btn-sm" aria-label="confirm" type="submit" (click)="createMode ? createTag() : addTag()"
        [disabled]="createMode ? !newTagName?.length : !selectedTag">
        <span><fa-icon [icon]="formIcons.confirm"></fa-icon></span>
    </button>
    <button class="btn btn-body btn-sm" aria-label="cancel" type="reset" (click)="cancel.emit()" type="button">
        <span><fa-icon [icon]="formIcons.reset"></fa-icon></span>
    </button>
</form>
