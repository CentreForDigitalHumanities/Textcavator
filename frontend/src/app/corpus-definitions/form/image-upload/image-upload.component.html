<h2 class="mb-4">Image</h2>

<p class="form-label">
    Current image @if (!corpus.hasImage) {<span>(default)</span>}:
</p>

@if (imageURL$ | async; as url) {
    <div class="corpus-image-container mb-3" style="max-width: 400px;">
        <img [src]="url" class="rounded" />
    </div>
}

<div class="row g-2">
    <div class="col-md-auto">
        <label class="file-label" for="input-corpus-image">
        <input class="form-control" type="file" name="image-upload"
            id="input-corpus-image"
            accept="image/png,image/jpeg" (input)="onImageUpload($event)" />
        </label>
    </div>
    <div class="col-md-auto">
        <button class="btn btn-body" type="button" (click)="deleteImage()">
            <fa-icon [icon]="actionIcons.remove" />
            Remove image
        </button>
    </div>
</div>

<ia-form-feedback [showSuccess]="showSuccess" [showError]="showError" />
