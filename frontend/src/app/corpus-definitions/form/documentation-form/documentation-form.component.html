<h2 class="mb-4 is-5">Documentation</h2>


<p class="my-3">
  Add documentation to help users understand what your corpus is, and how they can use
  it in their research.
</p>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="my-3">
    <ia-tabs>
      @for (category of categories; track category) {
        <ng-template iaTabPanel
          [id]="category.id" [title]="category.title">
          <p class="my-3">{{category.description}}</p>
          <ia-markdown-editor [formControl]="form.controls[category.id]" />
        </ng-template>
      }
    </ia-tabs>
  </div>

  <div class="my-3">
    <button class="btn btn-primary" type="submit" [iaButtonLoading]="loading$ | async">
      <span ><fa-icon [icon]="formIcons.confirm" /></span>
      <span>Save changes</span>
    </button>
  </div>

  <ia-form-feedback [showSuccess]="showSuccessMessage$ | async"
    [showError]="showErrorMessage$ | async" />
</form>
