<section class="py-5">
  <div class="container">
    <nav aria-label="secondary navigation" class="breadcrumb">
      <ul>
        <li><a [routerLink]="['/']">{{appName}}</a></li>
        <li><a [routerLink]="['..']">Custom corpora</a></li>
        <li class="is-active" aria-current="page"><a>New corpus</a></li>
      </ul>
    </nav>

    <h1 class="title">New corpus</h1>

    <ia-tabs>
      <!-- Create from scratch -->
      <ng-template iaTabPanel id="newCorpusTab" title="Create using the interactive editor">
        <form>
          <div class="field">
            <label class="form-label" for="title">Title</label>
            <div class="control">
              <input class="form-control" type="text" name="title" [(ngModel)]="newCorpusTitle" />
            </div>
            <p class="form-text">Enter a short, clear title for your corpus.</p>
          </div>
          <div class="my-3">
            <button class="btn btn-primary" type="submit" (click)="submit()">
              <span  aria-hidden="true">
                <fa-icon [icon]="formIcons.confirm"></fa-icon>
              </span>
              <span>
                Save corpus
              </span>
            </button>
          </div>
        </form>
      </ng-template>

      <!-- Upload JSON -->
      <ng-template iaTabPanel id="uploadJSONTab" title="Upload a JSON definition">
        <p class="my-3">
          Upload a JSON definition file to add it as a corpus.
        </p>
        <form>
          <div class="my-3">
            <ia-definition-json-upload [reset]="reset$" (upload)="onJSONUpload($event)">
            </ia-definition-json-upload>
          </div>

          @if (corpus.isComplete()) {
            <div class="my-3">
              <button class="btn btn-primary" type="submit" (click)="saveCorpus(true)">
                <span  aria-hidden="true">
                  <fa-icon [icon]="formIcons.confirm"></fa-icon>
                </span>
                <span>
                  Save corpus
                </span>
              </button>
            </div>
          }

          @if (error) {
            <div class="message is-danger">
              <div class="message-body">
                Could not save corpus: {{error.message}}
              </div>
            </div>
          }
        </form>
      </ng-template>
    </ia-tabs>

  </div>
</section>
