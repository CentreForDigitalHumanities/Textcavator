<div class="slider bg-secondary-subtle rounded py-1 w-100 position-relative">
    <button class="slider-thumb bg-primary position-absolute border-0"
        [style.left]="lowerPosition()"
        type="button"
        role="slider"
        aria-label="minimum value"
        tabindex="0"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="lower()"
        (keydown.arrowleft)="decrease(lower, min(), upper())"
        (keydown.arrowright)="increase(lower, min(), upper())"
    ></button>
    <!-- <div class="slider-range bg-primary" aria-hidden="true"></div>  -->
    <button class="slider-thumb bg-primary position-absolute border-0"
        [style.left]="upperPosition()"
        type="button"
        role="slider"
        aria-label="maximum value"
        tabindex="0"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="upper()"
        (keydown.arrowleft)="decrease(upper, lower(), max())"
        (keydown.arrowright)="increase(upper, lower(), max())"
    ></button>
</div>


<div>
    {{lower()}} - {{upper()}}
</div>
