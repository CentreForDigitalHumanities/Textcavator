@if (min !== undefined && max !== undefined) {
  @if ((filter?.state$ | async).data; as data) {
    <div class="range">
      <span>{{data.min}} - {{data.max}}</span>
      <ia-slider [min]="min" [max]="max" />
      <!-- <p-slider [animate]="true" [ngModel]="[data.min, data.max]"
        [range]="true" [min]="min" [max]="max"
        (onChange)="sliderValue$.next($event.values)"
        ariaLabelledBy="legend-filter-{{filter.displayName | slugify}}" /> -->
    </div>
  }
}
