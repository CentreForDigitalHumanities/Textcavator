@if (filter) {
    <div class="bool">
        <ia-dropdown [value]="data" (onChange)="update($event)">
            <button iaDropdownToggle aria-labelledby="legend-filter-{{filter.displayName | slugify}}">
                {{data !== undefined ? (data | json) : 'Choose'}}
            </button>
            <div iaDropdownMenu>
                <button iaDropdownItem [value]="true">True</button>
                <button iaDropdownItem [value]="false">False</button>
            </div>
        </ia-dropdown>
    </div>
}
