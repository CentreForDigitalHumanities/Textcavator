@if (filter) {
  <div class="bool">
    <ia-dropdown [value]="data" (onChange)="update($event)"
      labelledBy="legend-filter-{{filter.displayName | slugify}}">
      <span iaDropdownLabel>{{data !== undefined ? (data | json) : 'Choose'}}</span>
      <div iaDropdownMenu>
        <button iaDropdownItem [value]="true">True</button>
        <button iaDropdownItem [value]="false">False</button>
      </div>
    </ia-dropdown>
  </div>
}
