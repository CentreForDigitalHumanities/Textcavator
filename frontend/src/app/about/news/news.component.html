<div class="container py-5">
    <h1>News</h1>

    @let data = data$ | async;
    <div [ia-loading]="!data">
        @for (item of data; track item.id) {
            <div class="my-4">
                <ia-news-item  [item]="item" />
            </div>
        } @empty {
            <p><i>No news items to display.</i></p>
        }
    </div>
</div>
