<button class="btn btn-body" (click)="confirmDelete.open()">
    <fa-icon [icon]="actionIcons.delete"></fa-icon>
    Delete my search history
</button>

<ia-confirm-modal #confirmDelete actionText="Delete search history"
    actionButtonClass="btn-danger" [icon]="actionIcons.delete"
    (accept)="deleteHistory()"
>
    <p>This action will delete all of your search history. This cannot be reversed.</p>
</ia-confirm-modal>
