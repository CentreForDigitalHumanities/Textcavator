<h2 class="mb-4 is-4">Change password</h2>

<form [formGroup]="form">
    <div class="field">
        <div class="control">
            <label for="input-old-password">Old password</label>
            <input id="input-old-password" type="password" class="form-control"
                autocomplete="current-password"
                [formControl]="form.controls.oldPassword"
                [class.is-danger]="!!invalidFeedback.oldPassword">
        </div>
        <div class="form-control-feedback" aria-live="polite">
            <div class="message is-danger"
                [class.is-hidden]="!invalidFeedback.oldPassword">
                <p class="message-body">
                    {{invalidFeedback.oldPassword}}
                </p>
            </div>
        </div>
    </div>
    <div class="field">
        <div class="control">
            <label for="input-new-password-1">New password</label>
            <input id="input-new-password-1" type="password" class="form-control"
                autocomplete="new-password"
                [formControl]="form.controls.newPassword1"
                [class.is-danger]="!!invalidFeedback.newPassword1">
        </div>
        <div class="form-control-feedback" aria-live="polite">
            <div class="message is-danger"
                [class.is-hidden]="!invalidFeedback.newPassword1">
                <p class="message-body">
                    {{invalidFeedback.newPassword1}}
                </p>
            </div>
        </div>
    </div>
    <div class="field">
        <div class="control">
            <label for="input-new-password-2">Repeat new password</label>
            <input id="input-new-password-2" type="password" class="form-control"
                autocomplete="new-password"
                [formControl]="form.controls.newPassword2"
                [class.is-danger]="!!invalidFeedback.newPassword2">
        </div>
        <div class="form-control-feedback" aria-live="polite">
            <div class="message is-danger"
                [class.is-hidden]="!invalidFeedback.newPassword2">
                <p class="message-body">
                    {{invalidFeedback.newPassword2}}
                </p>
            </div>
        </div>
    </div>
    <div class="field">
        <div class="control">
            <button type="submit" class="btn btn-primary" (click)="submit()">
                <span >
                    <fa-icon [icon]="formIcons.confirm" />
                </span>
                <span>
                    Save new password
                </span>
            </button>
        </div>
    </div>
    <div aria="live-polite">
        <div class="message is-success" [class.is-hidden]="!successFeedback">
            <p class="message-body">
                {{successFeedback}}
            </p>
        </div>
    </div>
</form>
