<div [class.is-hidden]="asTable">
  <div class="my-3">
    <div class="field">
      <label class="form-label">Show as:</label>
      <div class="control radios">
        @for (style of ['line', 'bar']; track style) {
          <label class="radio">
            <input type="radio" [checked]="graphStyle.value===style" (click)="graphStyle.next(style)" (keydown.enter)="graphStyle.next(style)">
            {{style | titlecase}}
          </label>
        }
      </div>
    </div>
    @if (graphStyle.value==='bar') {
      <div class="field">
        <div class="control">
          <label class="form-label">Time interval:</label>
          <ia-time-interval-slider [labels]="timeIntervals" (currentIndex)="zoomTimeInterval($event)"></ia-time-interval-slider>
        </div>
      </div>
    }
  </div>

  <canvas id="chart"></canvas>
</div>

@if (asTable && terms.length) {
  <div class="my-3">
    <ia-freqtable  [headers]="tableHeaders" [data]="tableData" [defaultSort]="'similarity'" [name]="tableFileName">
    </ia-freqtable>
  </div>
}
