<form class="my-3">
    <div class="field">
        <label class="form-label">Nearest neighbours to include:</label>
        <div class="input-group">
            <input class="form-control" type="number" value="5" min="0" name="neighbours"
                [(ngModel)]="neighbours">
            <button class="btn btn-primary" type="submit" (click)="getData()">
                <span >
                    <fa-icon [icon]="formIcons.confirm"></fa-icon>
                </span>
                <span>Confirm</span>
            </button>
        </div>
    </div>
</form>

<div class="my-3">
    <ia-similarity-chart [timeIntervals]="timeIntervals" [totalData]="totalData" [zoomedInData]="zoomedInData"
        [palette]="palette" [asTable]="asTable"></ia-similarity-chart>
</div>
