<section class="py-5">
  <div class="container" [iaLoading]="isLoading | async">
    @if (items) {
      @if (showCorpusFilters) {
        <div class="my-3">
          <ia-corpus-filter [corpora]="items" (filtered)="filteredItems = $event"></ia-corpus-filter>
        </div>
      } @else {
        <div style="margin-bottom: 3rem;"></div>
      }
      @for (item of displayItems; track item) {
        <div class="my-3">
          <ia-corpus-selector [corpus]="item"></ia-corpus-selector>
        </div>
      }
    }

    @if (displayItems?.length === 0) {
      <p>
        <i>No corpora to display.</i>
      </p>
    }
  </div>
</section>
