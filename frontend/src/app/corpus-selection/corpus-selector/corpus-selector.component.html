<div class="card border-0 bg-primary text-bg-primary">
    <div class="row g-0">
        <div class="col-md-3">
            <div [style.background-image]="backgroundImage(corpus)"
                class="corpus-image rounded-start"></div>
        </div>
        <div class="col-md-9 py-3 px-4 vstack">
            <div class="row">
                <div class="col">
                    <h2 class="card-title h4">
                      <a [routerLink]="['/search', corpus.name]"
                        class="text-bg-primary link-underline link-underline-opacity-0">
                        {{corpus.title}}
                      </a>
                    </h2>
                </div>
                @if (corpus.editable) {
                    <div class="col-auto">
                        <a class="text-bg-primary fs-5"
                            ngbTooltip="Edit corpus"
                            [routerLink]="['/custom-corpora/edit', corpus.id]"
                            aria-label="edit corpus">
                            <fa-icon [icon]="corpusIcons.edit" aria-hidden="true"></fa-icon>
                        </a>
                    </div>
                }
                <div class="col-auto">
                    <a class="text-bg-primary fs-5"
                        ngbTooltip="More information"
                        [routerLink]="['/info', corpus.name]"
                        aria-label="more information">
                        <fa-icon [icon]="corpusIcons.infoAlt" aria-hidden="true"></fa-icon>
                    </a>
                </div>
            </div>
            <hr class="mt-1">

            <div class="mb-4">
              {{corpus.description}}
            </div>

            <div class="row align-items-end mt-auto">
              <div class="col-md">
                <div>
                  <p class="heading">Language: <strong>{{corpus.displayLanguages}}</strong></p>
                  <p class="heading">Type: <strong>{{corpus.category}}</strong></p>
                  <p class="heading">Period: <strong>{{corpus.minYear}}-{{corpus. maxYear}}</strong></p>
                </div>
              </div>
              <div class="col-md text-end explore-column">
                <a class="btn btn-primary btn-lg bg-primary-subtle text-primary-emphasis"
                  [routerLink]="['/search', corpus.name]">
                    <fa-icon [icon]="corpusIcons.search" class="me-2"/>
                    Explore
                </a>
              </div>
            </div>
        </div>
    </div>
</div>
