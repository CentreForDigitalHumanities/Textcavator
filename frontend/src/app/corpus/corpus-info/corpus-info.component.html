<ia-corpus-header [corpus]="corpus" currentPage="info"></ia-corpus-header>

<section class="py-5 pt-0">
    <div class="container-lg">
        @if (documentation$ | async; as documentation) {
            <ul ngbNav #nav="ngbNav" class="nav-tabs mb-4">
                @for (page of documentation; track page.type) {
                    <li [ngbNavItem]="page.type">
                        <button ngbNavLink>{{page.type}}</button>
                        <ng-template ngbNavContent >
                            <div [innerHTML]="renderMarkdown(page.content)"></div>
                        </ng-template>
                    </li>
                }
                @if (corpus?.fields) {
                    <li ngbNavItem="fields">
                        <button ngbNavLink>Fields</button>
                        <ng-template ngbNavContent >
                            @for (field of corpus.fields; track field) {
                                <div class="my-3">
                                    <ia-field-info  [field]="field"
                                    [coverage]="fieldCoverage ? fieldCoverage[field.name] : undefined"
                                    [cardinality]="fieldCardinality ? fieldCardinality[field.name] : undefined">
                                    </ia-field-info>
                                </div>
                            }
                        </ng-template>
                    </li>
                }
            </ul>
            <div [ngbNavOutlet]="nav"></div>
        } @else {
            <div class="is-loading" aria-label="loading documentation"></div>
        }
    </div>
</section>
