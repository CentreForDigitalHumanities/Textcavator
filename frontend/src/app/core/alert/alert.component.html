@if (visible$|async) {
  <ngb-alert type="warning" (closed)="hideAlert()" class="m-2">
    @let alertConfig = alertMessage$ | async;
    @if (alertConfig.renderHtml) {
        <div [innerHtml]="alertConfig.message"></div>
    }
    @else {
    <div>{{alertConfig.message}}</div>
  }
  </ngb-alert>
}
