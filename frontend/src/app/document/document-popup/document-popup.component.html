<ng-template #modalTemplate>
    @let isFirstDocument = document.position <= 1;
    @let isLastDocument = document.position >= page.documents.length;

    <div class="modal-header justify-content-between align-items-center">
        <h1 class="modal-title h4" id="dialog-title">
            Document {{ documentPosition(document, page) }} of {{ page.total }}
        </h1>
        @if (showNEROption) {
            <ia-entity-toggle (toggleNER)="toggleNER($event)" />
        }
        <div class="d-flex gap-2 align-items-center">
            <button
                type="button"
                class="btn btn-ghost"
                [ngbTooltip]="
                    maximized ? 'Minimize document' : 'Maximize document'
                "
                [aria-label]="
                    maximized ? 'Minimize document' : 'Maximize document'
                "
                (click)="toggleMaximization()"
            >
                <fa-icon
                    [icon]="
                        maximized ? actionIcons.minimize : actionIcons.maximize
                    "
                    aria-hidden="true"
                />
            </button>
            <button
                type="button"
                class="btn-close"
                aria-label="Close"
                ngbAutofocus
                (click)="close()"
            ></button>
        </div>
    </div>
    <div class="modal-body">
        <ia-document-view
            [document]="document"
            [queryModel]="queryModel"
            [corpus]="document.corpus"
            [view]="view"
            [showEntities]="showNamedEntities"
        />
    </div>
    <div class="modal-footer">
        <div class="col">
            <button
                type="button"
                class="btn btn-ghost border-0"
                [class.disabled]="isFirstDocument"
                [attr.aria-disabled]="isFirstDocument"
                aria-label="View previous document"
                ngbTooltip="view previous document"
                (click)="!isFirstDocument && page.focusPrevious(document)"
                tabindex="0"
            >
                <fa-icon [icon]="actionIcons.prev" aria-hidden="true" />
            </button>
        </div>
        <div class="col-auto">
            <div class="hstack gap-2">
                <a
                    class="btn btn-ghost"
                    [routerLink]="documentPageLink"
                    ngbTooltip="view this document on its own page"
                    tabindex="0"
                >
                    <fa-icon [icon]="actionIcons.link"></fa-icon>
                    Link
                </a>
                @if (document.hasContext) {
                    <a
                        class="btn btn-ghost"
                        [routerLink]="['/search', document.corpus.name]"
                        [queryParams]="document.contextQueryParams"
                        ngbTooltip="view all documents from this {{
                            contextDisplayName
                        }}"
                        tabindex="0"
                    >
                        <fa-icon [icon]="documentIcons.context"></fa-icon>
                        View {{ contextDisplayName }}
                    </a>
                }
            </div>
        </div>
        <div class="col text-end">
            <button
                type="button"
                class="btn btn-ghost border-0"
                [class.disabled]="isLastDocument"
                [attr.aria-disabled]="isLastDocument"
                ngbTooltip="view next document"
                aria-label="View next document"
                (click)="!isLastDocument && page.focusNext(document)"
                tabindex="0"
            >
                <fa-icon [icon]="actionIcons.next" aria-hidden="true" />
            </button>
        </div>
    </div>
</ng-template>
