<footer>
  @if (entities) {
    <ul title="legend">
      @for (entity of entities; track entity) {
        <li>
          <span>
            <fa-icon [className]="'entity-'+entity+' entity-icon'" [icon]="entityIcons[entity]" [title]="entity"></fa-icon>
            {{entity | titlecase}}
          </span>
        </li>
      }
    </ul>
  } @else {
    <em class="no-entities-message">No named entities found.</em>
  }
</footer>
