@if (!pdfNotFound) {
  <div class="pdf" [ngClass]="{'is-loading':!isLoaded}">
    @if (page) {
      <pdf-viewer
        [src]="pdfSrc"
        [render-text]="true"
        [original-size]="false"
        [autoresize]="true"
        [show-all]="false"
        [page]="page"
        [zoom]="zoomFactor"
        (after-load-complete)="afterLoadComplete($event)"
        (error)="onError($event)"
        style="display:block;width: 100%; height: 75vh">
      </pdf-viewer>
    }
  </div>
}
