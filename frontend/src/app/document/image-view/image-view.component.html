@if (!noImages) {
    <div class="hstack">
        <button class="btn btn-ghost" (click)="zoomIn()"
            aria-label="zoom in">
            <fa-icon [icon]="scanIcons.zoomIn" aria-hidden="true"></fa-icon>
        </button>
        <button class="btn btn-ghost" (click)="zoomOut()"
            aria-label="zoom out">
            <fa-icon [icon]="scanIcons.zoomOut" aria-hidden="true"></fa-icon>
        </button>
        <button class="btn btn-ghost" (click)="resetZoom()"
            aria-label="reset zoom">
            <fa-icon [icon]="scanIcons.zoomReset" aria-hidden="true"></fa-icon>
        </button>
        @if (pageIndices) {
          <ia-image-navigation [pageIndices]="pageIndices" [initialPage]="initialPage"
            (pageIndexChange)="pageIndexChange($event)"></ia-image-navigation>
        }
        @if (allowDownload) {
          <button class="btn ms-auto btn-ghost" (click)="download()"
                aria-label="download image">
            <fa-icon [icon]="actionIcons.download" aria-hidden="true"></fa-icon>
          </button>
        }
    </div>
}

@if (noImages) {
  <p>No scan available for this document.</p>
}
@if (imagePaths) {
  <div [ngClass]="{'is-loading':imagePaths===undefined}">
    @if (mediaType!=='application/pdf') {
      <ia-scan-image [imagePaths]="imagePaths" [zoomFactor]="zoomFactor" [showPage]="showPage"></ia-scan-image>
    }
    @if (mediaType==='application/pdf') {
      <ia-scan-pdf [imagePaths]="imagePaths" [zoomFactor]="zoomFactor" [showPage]="showPage"></ia-scan-pdf>
    }
  </div>
}
